# Shared proxy settings for every daemon-bound location in nginx.conf.template.

proxy_http_version 1.1;

# Empty Connection header keeps the upstream connection pooled; a literal
# "close" would tear down keepalive on every request.
proxy_set_header Connection        "";
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Overwrite rather than append: the gateway keys rate limiting off this header,
# so a client-supplied X-Forwarded-For must never survive into the upstream.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# GET /api/events is a Server-Sent Events stream. Buffering or compressing it
# would hold bytes back until the connection closed, so the UI would show no
# live events at all.
proxy_buffering off;
gzip off;
